{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Delete Menu Item</h2>

    <p>Are you sure you want to delete "{{ item.name }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger">Yes Delete</button>
    </form>
</div>
{% endblock %}
